<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ATsys Dashboard v0.1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap correcto -->
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css)" rel="stylesheet">

    <!-- Chart.js correcto -->
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/chart.js)"></script>


    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
        }
        .title {
            text-align: center;
            margin-top: 20px;
            color: #69b7ff;
        }
    </style>
</head>

<body>

    <h1 class="title">ATsys Dashboard v0.1</h1>

    <div class="container mt-4">

        <!-- Row 1 -->
        <div class="row">

            <!-- Sistema -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h4>Sistema</h4>
                    <p><strong>Estado:</strong> <span id="sys_status">--</span></p>
                    <p><strong>Tendencia:</strong> <span id="predict_status">--</span></p>
                    <p><strong>Uptime:</strong> <span id="uptime">--</span> min</p>
                </div>
            </div>

            <!-- CPU -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h4>CPU</h4>
                    <p>Temperatura: <span id="cpu_temp">--</span> °C</p>
                    <p>Uso: <span id="cpu_usage">--</span> %</p>
                    <p>Frecuencia: <span id="cpu_freq">--</span> MHz</p>
                </div>
            </div>

            <!-- GPU -->
            <div class="col-md-4">
                <div class="card p-3">
                    <h4>GPU</h4>
                    <p>Temperatura: <span id="gpu_temp">--</span> °C</p>
                    <p>Uso: <span id="gpu_usage">--</span> %</p>
                    <p>Memoria: <span id="gpu_mem">--</span></p>
                </div>
            </div>

        </div>

        <!-- Row 2 -->
        <div class="row mt-4">

            <!-- CPU Chart -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h4>Gráfico CPU Temperatura</h4>
                    <canvas id="cpuChart"></canvas>
                </div>
            </div>

            <!-- GPU Chart -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h4>Gráfico GPU Temperatura</h4>
                    <canvas id="gpuChart"></canvas>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
